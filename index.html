<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6f8fc"><title>My Daily English</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#223047;background:#f6f8fc}*{box-sizing:border-box}body{margin:0}main{max-width:640px;margin:auto;padding:18px 16px 90px}header{text-align:center;padding:15px 0}h1{font-size:26px;margin:0;color:#2a568d}header p{color:#66758b;margin:8px 0}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 18px}button,select{font:inherit}button{border:0;border-radius:12px;padding:12px 13px;background:#e5edf8;color:#254c7c;cursor:pointer;font-weight:600}button:active{opacity:.7}.primary{background:#316bb0;color:white}.muted{background:#eef1f5;color:#536174}.panel{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 15px #233a5b0b}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}.sub{color:#718098;font-size:13px}.eyebrow{font-size:12px;color:#316bb0;font-weight:700}h2{font-size:21px;margin:8px 0}h3{margin:8px 0}.sentence{border-top:1px solid #edf0f4;padding:14px 0}.sentence:first-of-type{border:0}.english{font-size:19px;font-weight:650;margin:0 0 5px}.zh{color:#637086;margin:0 0 12px}.pill{border-radius:30px;padding:7px 10px;font-size:13px}.active{background:#316bb0;color:white}.full{width:100%}.hidden{display:none}.stat{flex:1;min-width:90px;text-align:center;background:#f1f6fc;padding:14px;border-radius:12px}.stat strong{font-size:22px;display:block;color:#316bb0}.small{font-size:12px}.progress{height:9px;background:#e5edf7;border-radius:9px;overflow:hidden}.progress div{height:100%;background:#57a69b;transition:width .2s}.notice{font-size:13px;color:#637086;line-height:1.6}.line{border-top:1px solid #edf0f4;margin:14px 0}.answer{display:block;width:100%;text-align:left;margin:7px 0}.success{color:#17845f}.error{color:#b04b40}select{border:1px solid #d6dfeb;border-radius:10px;padding:9px;background:white;color:#223047}button:disabled{opacity:.45}.tab{padding:10px 4px;font-size:13px}.chip{padding:9px;margin:3px}.count{font-size:13px;color:#718098}.dialogue{background:#f4f8fd;border-radius:12px;padding:12px;line-height:1.65}.sr-only{position:absolute;left:-9999px}</style></head><body><main><header><h1>My Daily English</h1><p>每天 5 分鐘，輕鬆開口說英文</p></header><nav><button class="tab active" data-tab="learn">學課程</button><button class="tab" data-tab="review">複習</button><button class="tab" data-tab="saved">收藏</button><button class="tab" data-tab="stats">進度</button></nav><div id="content"></div></main><script>
const lessons=[{"title":"Greetings","lines":[{"en":"Hello!","zh":"你好！"},{"en":"Good morning.","zh":"早安。"},{"en":"Good evening.","zh":"晚安（見面時）。"},{"en":"How are you?","zh":"你好嗎？"},{"en":"I am fine.","zh":"我很好。"}],"category":"基礎"},{"title":"Introduce Yourself","lines":[{"en":"My name is Elsa.","zh":"我的名字是 Elsa。"},{"en":"What is your name?","zh":"你叫什麼名字？"},{"en":"Nice to meet you.","zh":"很高興認識你。"},{"en":"I am from Taiwan.","zh":"我來自台灣。"},{"en":"I live in Taipei.","zh":"我住在台北。"}],"category":"基礎"},{"title":"Polite Words","lines":[{"en":"Please.","zh":"請。"},{"en":"Thank you.","zh":"謝謝你。"},{"en":"You are welcome.","zh":"不客氣。"},{"en":"Excuse me.","zh":"不好意思。"},{"en":"I am sorry.","zh":"對不起。"}],"category":"基礎"},{"title":"Simple Answers","lines":[{"en":"Yes, please.","zh":"好的，麻煩你。"},{"en":"No, thank you.","zh":"不用，謝謝。"},{"en":"Maybe later.","zh":"也許晚一點。"},{"en":"Of course.","zh":"當然。"},{"en":"I do not know.","zh":"我不知道。"}],"category":"基礎"},{"title":"Everyday Questions","lines":[{"en":"What is this?","zh":"這是什麼？"},{"en":"Who is that?","zh":"那是誰？"},{"en":"Where are you?","zh":"你在哪裡？"},{"en":"When is it?","zh":"什麼時候？"},{"en":"Why not?","zh":"為什麼不？"}],"category":"基礎"},{"title":"Numbers","lines":[{"en":"One, two, three.","zh":"一、二、三。"},{"en":"Four, five, six.","zh":"四、五、六。"},{"en":"Seven, eight, nine.","zh":"七、八、九。"},{"en":"Ten.","zh":"十。"},{"en":"How many?","zh":"多少個？"}],"category":"基礎"},{"title":"Time","lines":[{"en":"What time is it?","zh":"現在幾點？"},{"en":"It is nine o’clock.","zh":"現在九點。"},{"en":"It is early.","zh":"現在還早。"},{"en":"I am late.","zh":"我遲到了。"},{"en":"See you at five.","zh":"五點見。"}],"category":"基礎"},{"title":"Days","lines":[{"en":"Today is Monday.","zh":"今天是星期一。"},{"en":"Tomorrow is Tuesday.","zh":"明天是星期二。"},{"en":"Yesterday was Sunday.","zh":"昨天是星期日。"},{"en":"See you tomorrow.","zh":"明天見。"},{"en":"Have a nice weekend.","zh":"週末愉快。"}],"category":"基礎"},{"title":"Family","lines":[{"en":"This is my family.","zh":"這是我的家人。"},{"en":"I have one child.","zh":"我有一個小孩。"},{"en":"My husband is at home.","zh":"我先生在家。"},{"en":"This is my mother.","zh":"這是我媽媽。"},{"en":"We are happy.","zh":"我們很開心。"}],"category":"基礎"},{"title":"Feelings","lines":[{"en":"I am happy.","zh":"我很開心。"},{"en":"I am tired.","zh":"我累了。"},{"en":"I am hungry.","zh":"我餓了。"},{"en":"I am nervous.","zh":"我很緊張。"},{"en":"I feel better.","zh":"我感覺好多了。"}],"category":"基礎"},{"title":"Daily Routine","lines":[{"en":"I wake up early.","zh":"我很早起床。"},{"en":"I brush my teeth.","zh":"我刷牙。"},{"en":"I eat breakfast.","zh":"我吃早餐。"},{"en":"I go to work.","zh":"我去上班。"},{"en":"I go to bed.","zh":"我去睡覺。"}],"category":"生活"},{"title":"At Home","lines":[{"en":"I am at home.","zh":"我在家。"},{"en":"Please open the door.","zh":"請開門。"},{"en":"Close the window.","zh":"關上窗戶。"},{"en":"Turn on the light.","zh":"開燈。"},{"en":"The room is clean.","zh":"房間很乾淨。"}],"category":"生活"},{"title":"Food","lines":[{"en":"I like rice.","zh":"我喜歡飯。"},{"en":"I want some water.","zh":"我想喝點水。"},{"en":"This is delicious.","zh":"這很好吃。"},{"en":"I am full.","zh":"我吃飽了。"},{"en":"What would you like?","zh":"你想要什麼？"}],"category":"生活"},{"title":"Ordering Drinks","lines":[{"en":"One coffee, please.","zh":"請給我一杯咖啡。"},{"en":"I would like tea.","zh":"我想喝茶。"},{"en":"No sugar, please.","zh":"請不要加糖。"},{"en":"Can I have ice?","zh":"可以加冰塊嗎？"},{"en":"How much is it?","zh":"這多少錢？"}],"category":"生活"},{"title":"Shopping","lines":[{"en":"I am just looking.","zh":"我只是看看。"},{"en":"Do you have this?","zh":"你們有這個嗎？"},{"en":"It is too expensive.","zh":"這太貴了。"},{"en":"Can I try it on?","zh":"我可以試穿嗎？"},{"en":"I will take it.","zh":"我要買這個。"}],"category":"生活"},{"title":"Weather","lines":[{"en":"It is sunny today.","zh":"今天是晴天。"},{"en":"It is raining.","zh":"正在下雨。"},{"en":"It is very hot.","zh":"天氣很熱。"},{"en":"It is cold outside.","zh":"外面很冷。"},{"en":"Take an umbrella.","zh":"帶把傘。"}],"category":"生活"},{"title":"Directions","lines":[{"en":"Where is the station?","zh":"車站在哪裡？"},{"en":"Go straight.","zh":"直走。"},{"en":"Turn left.","zh":"左轉。"},{"en":"Turn right.","zh":"右轉。"},{"en":"It is near here.","zh":"就在這附近。"}],"category":"生活"},{"title":"Transportation","lines":[{"en":"I need a taxi.","zh":"我需要計程車。"},{"en":"Where is the bus stop?","zh":"公車站在哪裡？"},{"en":"I take the train.","zh":"我搭火車。"},{"en":"Is this seat taken?","zh":"這個位子有人坐嗎？"},{"en":"Please stop here.","zh":"請在這裡停車。"}],"category":"生活"},{"title":"At the Restaurant","lines":[{"en":"A table for two, please.","zh":"請給我兩人座位。"},{"en":"May I see the menu?","zh":"可以給我菜單嗎？"},{"en":"I would like this.","zh":"我想點這個。"},{"en":"The bill, please.","zh":"請結帳。"},{"en":"Everything was great.","zh":"一切都很好。"}],"category":"生活"},{"title":"At Work","lines":[{"en":"I am at work.","zh":"我在上班。"},{"en":"I have a meeting.","zh":"我有一場會議。"},{"en":"Please send me the file.","zh":"請把檔案寄給我。"},{"en":"I will check it.","zh":"我會確認。"},{"en":"Thank you for your help.","zh":"謝謝你的幫忙。"}],"category":"職場"},{"title":"Email Basics","lines":[{"en":"I received your email.","zh":"我收到你的電子郵件了。"},{"en":"Please see the attachment.","zh":"請查看附件。"},{"en":"I have a question.","zh":"我有個問題。"},{"en":"I will reply soon.","zh":"我會盡快回覆。"},{"en":"Best regards.","zh":"敬祝順心（信件結尾）。"}],"category":"職場"},{"title":"Phone Calls","lines":[{"en":"Hello, this is Elsa.","zh":"你好，我是 Elsa。"},{"en":"May I speak to Amy?","zh":"請問 Amy 在嗎？"},{"en":"Please hold on.","zh":"請稍等。"},{"en":"Can I call you back?","zh":"我可以回電嗎？"},{"en":"Thank you for calling.","zh":"謝謝你的來電。"}],"category":"職場"},{"title":"Making Plans","lines":[{"en":"Are you free tomorrow?","zh":"你明天有空嗎？"},{"en":"Let us meet at noon.","zh":"我們中午見吧。"},{"en":"That sounds good.","zh":"聽起來不錯。"},{"en":"I have other plans.","zh":"我有其他安排。"},{"en":"See you then.","zh":"到時見。"}],"category":"職場"},{"title":"Asking for Help","lines":[{"en":"Can you help me?","zh":"你可以幫我嗎？"},{"en":"I need some help.","zh":"我需要幫忙。"},{"en":"Please speak slowly.","zh":"請說慢一點。"},{"en":"Could you repeat that?","zh":"可以再說一次嗎？"},{"en":"I understand now.","zh":"我現在懂了。"}],"category":"職場"},{"title":"At the Airport","lines":[{"en":"Where is check-in?","zh":"報到櫃檯在哪裡？"},{"en":"Here is my passport.","zh":"這是我的護照。"},{"en":"Where is gate five?","zh":"五號登機門在哪裡？"},{"en":"Is the flight on time?","zh":"班機準時嗎？"},{"en":"I have one suitcase.","zh":"我有一個行李箱。"}],"category":"旅遊"},{"title":"At the Hotel","lines":[{"en":"I have a reservation.","zh":"我有訂房。"},{"en":"I would like to check in.","zh":"我想辦理入住。"},{"en":"What time is breakfast?","zh":"早餐是幾點？"},{"en":"Can I have a towel?","zh":"可以給我一條毛巾嗎？"},{"en":"I would like to check out.","zh":"我想退房。"}],"category":"旅遊"},{"title":"Health and Comfort","lines":[{"en":"I do not feel well.","zh":"我不太舒服。"},{"en":"I have a headache.","zh":"我頭痛。"},{"en":"I need some rest.","zh":"我需要休息。"},{"en":"Where is the pharmacy?","zh":"藥局在哪裡？"},{"en":"I feel much better.","zh":"我感覺好多了。"}],"category":"旅遊"},{"title":"Opinions","lines":[{"en":"I like this idea.","zh":"我喜歡這個主意。"},{"en":"I agree with you.","zh":"我同意你。"},{"en":"I am not sure.","zh":"我不太確定。"},{"en":"What do you think?","zh":"你覺得呢？"},{"en":"That is interesting.","zh":"那很有趣。"}],"category":"會話"},{"title":"Small Talk","lines":[{"en":"How was your day?","zh":"你今天過得如何？"},{"en":"It was a busy day.","zh":"今天很忙。"},{"en":"What are you doing?","zh":"你正在做什麼？"},{"en":"Do you have any plans?","zh":"你有什麼計畫嗎？"},{"en":"Have a good night.","zh":"祝你今晚愉快。"}],"category":"會話"},{"title":"Putting It Together","lines":[{"en":"Hello, nice to meet you.","zh":"你好，很高興認識你。"},{"en":"Could you speak slowly?","zh":"你可以說慢一點嗎？"},{"en":"I would like a coffee, please.","zh":"我想要一杯咖啡，謝謝。"},{"en":"I will send the file today.","zh":"我今天會寄出檔案。"},{"en":"Thank you. See you tomorrow.","zh":"謝謝，明天見。"}],"category":"會話"}];
const KEY='mydailyenglish_v2';
const defaults={current:0,completed:[],review:[],saved:[],rate:0.85,levelDone:false};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state={...defaults}};
let tab='learn',quiz=null,recognition=null;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('進度無法儲存，請確認瀏覽器儲存空間。')}}
function key(i,j){return i+':'+j}
function speak(s){if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=Number(state.rate);speechSynthesis.speak(u)}
function setTab(t){tab=t;quiz=null;render()}
function go(i){state.current=Math.max(0,Math.min(lessons.length-1,i));save();tab='learn';quiz=null;render();window.scrollTo(0,0)}
function complete(){if(!state.completed.includes(state.current))state.completed.push(state.current);save();go(Math.min(state.current+1,lessons.length-1))}
function toggle(kind,k){let a=state[kind];state[kind]=a.includes(k)?a.filter(x=>x!==k):[...a,k];save();render()}
function lineHTML(l,i,j){let k=key(i,j),fav=state.saved.includes(k),rev=state.review.includes(k);return `<div class="sentence"><div class="english">${esc(l.en)}</div><p class="zh">${esc(l.zh)}</p><div class="row"><button onclick="speak(${JSON.stringify(l.en).replace(/</g,'\\u003c')})">▶ 聽發音</button><button class="muted" onclick="listen(${i},${j})">🎤 跟讀</button><button class="pill ${fav?'active':''}" onclick="toggle('saved','${k}')">${fav?'♥ 已收藏':'♡ 收藏'}</button><button class="pill ${rev?'active':''}" onclick="toggle('review','${k}')">${rev?'✓ 待複習':'＋ 複習'}</button></div><div id="feedback-${i}-${j}" class="notice" aria-live="polite"></div></div>`}
function listen(i,j){let SR=window.SpeechRecognition||window.webkitSpeechRecognition,el=$('feedback-'+i+'-'+j);if(!SR){el.textContent='這台 iPhone 的瀏覽器暫不支援語音辨識，仍可聽發音並自行跟讀。';return}try{if(recognition)recognition.abort();recognition=new SR();recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=1;el.textContent='正在聽你說英文…（請允許麥克風權限）';recognition.onresult=e=>{let said=e.results[0][0].transcript,target=lessons[i].lines[j].en;let clean=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();el.innerHTML=`你說的是：${esc(said)}<br><span class="${clean(said)===clean(target)?'success':''}">${clean(said)===clean(target)?'✓ 辨識文字與目標相同！':'可再聽一次並跟讀。辨識結果不代表發音評分。'}</span>`};recognition.onerror=e=>el.textContent='語音辨識未完成：'+e.error+'。可繼續使用聽力功能。';recognition.start()}catch(e){el.textContent='無法啟動語音辨識，請改用聽發音自行跟讀。'}}
function renderLearn(){let i=state.current,l=lessons[i],done=state.completed.includes(i);let h=`<section class="panel"><div class="row between"><div><div class="eyebrow">LESSON ${String(i+1).padStart(2,'0')} · ${esc(l.category)}</div><h2>${esc(l.title)}</h2><div class="sub">每堂約 5 分鐘 · 已會可直接下一堂</div></div><span class="count">${i+1} / ${lessons.length}</span></div><div class="line"></div><div class="row"><label for="lesson">選擇課程</label><select id="lesson" class="grow" onchange="go(Number(this.value))">${lessons.map((x,n)=>`<option value="${n}" ${n===i?'selected':''}>${state.completed.includes(n)?'✓ ':''}${String(n+1).padStart(2,'0')} ${esc(x.title)}</option>`).join('')}</select></div><div class="row" style="margin-top:12px"><label for="rate">語速</label><select id="rate" onchange="state.rate=Number(this.value);save()"><option value="0.7" ${state.rate===0.7?'selected':''}>慢速</option><option value="0.85" ${state.rate===0.85?'selected':''}>跟讀</option><option value="1" ${state.rate===1?'selected':''}>正常</option></select></div></section><section class="panel">${l.lines.map((x,j)=>lineHTML(x,i,j)).join('')}</section><section class="panel"><h3>情境小對話</h3><div class="dialogue"><b>A:</b> ${esc(l.lines[0].en)}<br><b>B:</b> ${esc(l.lines[1].en)}<br><span class="sub">A：${esc(l.lines[0].zh)}<br>B：${esc(l.lines[1].zh)}</span></div><div class="row" style="margin-top:12px"><button onclick="speak(${JSON.stringify(l.lines[0].en+' '+l.lines[1].en)})">▶ 聽對話</button><button onclick="startQuiz(false)">小測驗</button></div></section><section class="panel"><div class="row"><button class="muted grow" onclick="go(${Math.max(0,i-1)})" ${i===0?'disabled':''}>← 上一堂</button><button class="primary grow" onclick="complete()">${done?'下一堂 →':'✓ 我已經會了 · 下一堂 →'}</button></div><p class="notice">按「我已經會了」會將本堂標記完成。你也可以直接從課程選單跳到任何一堂。</p></section>`;if(!state.levelDone)h=`<section class="panel"><h3>第一次使用？先測試程度</h3><p class="notice">用 5 題簡單英文題目了解目前程度，也可以略過，直接從基礎開始。</p><div class="row"><button onclick="startQuiz(true)">開始程度小測驗</button><button class="muted" onclick="state.levelDone=true;save();render()">先從基礎開始</button></div></section>`+h;return h}
function renderCollection(kind){let arr=state[kind];return `<section class="panel"><h2>${kind==='review'?'需要複習':'我的收藏本'}</h2><p class="notice">${kind==='review'?'把不熟悉的句子加進來，隨時回來練習。':'收藏你想反覆練習的實用英文。'}</p>${arr.length?arr.map(k=>{let [i,j]=k.split(':').map(Number);return lessons[i]?.lines[j]?`<div class="sub">Lesson ${i+1} · ${esc(lessons[i].title)}</div>${lineHTML(lessons[i].lines[j],i,j)}`:''}).join(''):'<p class="notice">目前還沒有句子，請到課程頁面加入。</p>'}</section>`}
function renderStats(){let count=state.completed.length,percent=Math.round(count/lessons.length*100);return `<section class="panel"><h2>我的學習進度</h2><div class="row"><div class="stat"><strong>${count}</strong><span class="small">完成課程</span></div><div class="stat"><strong>${state.saved.length}</strong><span class="small">收藏句子</span></div><div class="stat"><strong>${state.review.length}</strong><span class="small">待複習句子</span></div></div><p class="sub">目前這一批課程完成率 ${percent}%</p><div class="progress"><div style="width:${percent}%"></div></div><p class="notice">已完成的課程可以隨時重學。新增課程後，進度會保留在這台裝置的瀏覽器中。</p><button onclick="exportData()">匯出學習進度備份</button><p class="notice">換手機、清除瀏覽器資料或使用無痕模式可能導致進度消失，建議定期備份。</p><details><summary>還原備份</summary><p class="notice">選擇先前匯出的 JSON 備份檔。</p><input type="file" accept="application/json,.json" onchange="importData(this)"></details></section>`}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-daily-english-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.completed)||!Array.isArray(d.saved)||!Array.isArray(d.review))throw Error();if(!confirm('要以這份備份取代目前學習進度嗎？'))return;state={...defaults,...d};save();render();alert('備份已還原')}catch(e){alert('備份檔格式不正確')}};r.readAsText(f)}
const questions=[{q:'「謝謝」的英文是？',opts:['Thank you.','Good night.','Excuse me.'],a:0},{q:'「你叫什麼名字？」的英文是？',opts:['Where are you?','What is your name?','How old are you?'],a:1},{q:'「我有點累」的英文是？',opts:['I am hungry.','I am happy.','I am tired.'],a:2},{q:'「請說慢一點」的英文是？',opts:['Please speak slowly.','Please sit down.','Please come in.'],a:0},{q:'「我會確認」的英文是？',opts:['I am late.','I will check it.','I need a taxi.'],a:1}];
function startQuiz(level){quiz={level,idx:0,score:0,answered:false};render()}
function answer(n){if(quiz.answered)return;quiz.answered=true;quiz.score+=Number(n===questions[quiz.idx].a);render()}
function nextQ(){quiz.idx++;quiz.answered=false;render()}
function finishQuiz(){let level=quiz.level,score=quiz.score;quiz=null;if(level){state.levelDone=true;if(score>=4&&state.current<10)state.current=10;save()}render();alert(level?`程度測驗完成：${score}/5 題。${score>=4?'已建議從 Lesson 11 開始，也可自由回到基礎課。':'建議從 Lesson 01 開始。'}`:`完成小測驗：${score}/5 題！`)}
function renderQuiz(){if(quiz.idx>=questions.length)return '';let q=questions[quiz.idx],correct=q.a;return `<section class="panel"><div class="eyebrow">${quiz.level?'英文程度測驗':'本堂延伸小測驗'} · ${quiz.idx+1}/5</div><h2>${esc(q.q)}</h2>${q.opts.map((s,i)=>`<button class="answer ${quiz.answered&&i===correct?'primary':''}" ${quiz.answered?'disabled':''} onclick="answer(${i})">${esc(s)}</button>`).join('')}${quiz.answered?`<p class="success">正確答案：${esc(q.opts[correct])}</p><button class="primary full" onclick="${quiz.idx===4?'finishQuiz()':'nextQ()'}">${quiz.idx===4?'查看結果':'下一題 →'}</button>`:''}<p class="notice">這是簡單的理解測驗，不是正式英文程度檢定。</p></section>`}
function render(){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));$('content').innerHTML=quiz?renderQuiz():tab==='learn'?renderLearn():tab==='review'?renderCollection('review'):tab==='saved'?renderCollection('saved'):renderStats()}
render();
</script></body></html>
