
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Daily English</title>
<style>
body {
  font-family: -apple-system, sans-serif;

main {
  max-width: 500px;
  margin: auto;
}
h1 { color: #4466a9; }

  background: white;
  border-radius: 18px;
  padding: 24px;
