<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Daily English</title>
<style>
body{font-family:-apple-system,sans-serif;background:#f5f7fc;color:#25334b;margin:0;padding:24px}
main{max-width:500px;margin:auto}
h1{color:#4466a9}
.card{background:white;border-radius:18px;padding:24px;margin-top:20px;box-shadow:0 3px 12px #00000010}
audio{width:100%;margin:12px 0 20px}
small{color:#667}
</style>
</head>
<body>
<main>
<h1>My Daily English</h1>
<p>每天15分鐘，輕鬆開口說英文</p>
<div class="card">
<h2>Day 01｜日常打招呼</h2>
<p>Hello!｜你好！</p>
<audio controls preload="none" src="https://dict.youdao.com/dictvoice?audio=Hello%21&type=2"></audio>
</div>
<div class="card">
<h2>Day 02｜自我介紹</h2>
<p>1. Hello!｜你好！</p>
<audio controls preload="none" src="https://dict.youdao.com/dictvoice?audio=Hello%21&type=2"></audio>
<p>2. My name is Elsa.｜我的名字是 Elsa。</p>
<audio controls preload="none" src="https://dict.youdao.com/dictvoice?audio=My%20name%20is%20Elsa.&type=2"></audio>
<p>3. Nice to meet you.｜很高興認識你。</p>
<audio controls preload="none" src="https://dict.youdao.com/dictvoice?audio=Nice%20to%20meet%20you.&type=2"></audio>
<p>4. How are you?｜你好嗎？</p>
<audio controls preload="none" src="https://dict.youdao.com/dictvoice?audio=How%20are%20you%3F&type=2"></audio>
<p>5. I'm fine, thank you.｜我很好，謝謝。</p>
<audio controls preload="none" src="https://dict.youdao.com/dictvoice?audio=I%27m%20fine%2C%20thank%20you.&type=2"></audio>
<small>按下每句下方的 ▶ 播放英文，跟著練習三次。</small>
</div>
</main>
</body>
</html>
